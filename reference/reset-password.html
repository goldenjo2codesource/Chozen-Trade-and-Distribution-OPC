<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Chozen Resources Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="CRI Logo.jpg" alt="CRI Logo">
        <span class="brand-name">Chozen Resources Inc.<small>Manpower & Placement Agency</small></span>
      </a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="login.html" data-auth-link>Login</a>
      </nav>
      <button class="nav-toggle" aria-label="Open menu">☰</button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-wrap" style="max-width:520px;grid-template-columns:1fr;">
      <div class="auth-box">
        <div style="text-align:center;margin-bottom:24px;">
          <div style="font-size:2.5rem;margin-bottom:8px;">🔐</div>
          <h2>Set New Password</h2>
          <p class="form-note">Enter your new password below.</p>
        </div>
        <div id="resetFormWrap">
          <form id="resetPasswordForm">
            <div class="form-grid" style="gap:16px;">
              <div class="form-group">
                <label>New Password *</label>
                <div style="position:relative;">
                  <input id="newPw" type="password" required placeholder="Min 8 characters" minlength="8" style="padding-right:44px;">
                  <button type="button" onclick="togglePwVis('newPw',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.1rem;">👁</button>
                </div>
                <div class="pw-strength"><div class="pw-strength-bar" id="resetPwBar"></div></div>
              </div>
              <div class="form-group">
                <label>Confirm Password *</label>
                <input id="confirmPw" type="password" required placeholder="Re-enter new password">
              </div>
            </div>
            <div style="margin-top:20px;">
              <button class="btn primary full" type="submit">Set New Password</button>
              <p id="resetPwMsg" class="message" style="margin-top:10px;text-align:center;"></p>
            </div>
          </form>
        </div>
        <p class="switch-link" style="margin-top:16px;"><a href="login.html">← Back to Login</a></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function togglePwVis(id, btn) {
      const el = document.getElementById(id);
      if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
      else { el.type = 'password'; btn.textContent = '👁'; }
    }

    document.getElementById('newPw').addEventListener('input', function() {
      const bar = document.getElementById('resetPwBar');
      let s = 0;
      if (this.value.length >= 8) s++;
      if (/[A-Z]/.test(this.value)) s++;
      if (/[0-9]/.test(this.value)) s++;
      if (/[^A-Za-z0-9]/.test(this.value)) s++;
      const L = [['20%','#c0392b'],['40%','#e67e22'],['65%','#f1c40f'],['85%','#27ae60'],['100%','#1a7a3c']];
      const l = L[Math.min(s,4)];
      bar.style.width = this.value.length ? l[0] : '0';
      bar.style.background = l[1];
    });

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('resetFormWrap').innerHTML = '<div style="text-align:center;padding:20px;"><p style="color:var(--red);font-weight:700;">❌ Invalid or missing reset link.</p><a class="btn primary" href="login.html" style="margin-top:16px;display:inline-block;">Back to Login</a></div>';
    }

    document.getElementById('resetPasswordForm')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const pw = document.getElementById('newPw').value;
      const pw2 = document.getElementById('confirmPw').value;
      const msg = document.getElementById('resetPwMsg');
      if (pw.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; msg.className = 'message error'; return; }
      if (pw !== pw2) { msg.textContent = 'Passwords do not match.'; msg.className = 'message error'; return; }
      const btn = this.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Saving…';
      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw })
      })
      .then(r => r.ok ? r.json() : r.json().then(j => { throw new Error(j.error); }))
      .then(() => {
        document.getElementById('resetFormWrap').innerHTML = '<div style="text-align:center;padding:20px;"><div style="font-size:3rem;margin-bottom:12px;">✅</div><h3>Password Updated!</h3><p style="color:var(--muted);margin-bottom:20px;">You can now login with your new password.</p><a class="btn primary" href="login.html">Go to Login</a></div>';
      })
      .catch(err => { btn.disabled = false; btn.textContent = 'Set New Password'; msg.textContent = err.message || 'Failed. Link may have expired.'; msg.className = 'message error'; });
    });
  </script>
</body>
</html>
